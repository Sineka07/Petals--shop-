<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product — Petal Shop ??</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="particles"></div>
  <nav class="navbar" id="navbar"></nav>
  <div id="toast"></div>
  <div class="product-detail" id="detail">
    <div class="empty-state"><div class="empty-icon">??</div><p>Loading...</p></div>
  </div>
  <footer><span class="footer-logo">?? Petal Shop</span></footer>
  <script src="/js/app.js"></script>
  <script>
    function getImgHtml(image, name) {
      if (!image) return '???';
      if (image.startsWith('/')) return `<img src="${image}" alt="${name}" style="width:100%;height:100%;object-fit:cover;border-radius:16px;" />`;
      return image;
    }

    async function loadProduct() {
      const id  = location.pathname.split('/').pop();
      const res = await fetch('/api/products/' + id);
      if (!res.ok) {
        document.getElementById('detail').innerHTML = '<div class="empty-state"><div class="empty-icon">??</div><h3>Product not found</h3></div>';
        return;
      }
      const p = await res.json();
      document.title = p.name + ' — Petal Shop';
      document.getElementById('detail').innerHTML = `
        <div class="detail-img">${getImgHtml(p.image, p.name)}</div>
        <div class="detail-info">
          <div class="detail-category">${p.category || ''}</div>
          <h1 class="detail-name">${p.name}</h1>
          <div class="detail-price">$${Number(p.price).toFixed(2)}</div>
          <p class="detail-desc">${p.description || ''}</p>
          <div class="stock-badge">? ${p.stock} in stock</div>
          <div style="display:flex;gap:12px;align-items:center;margin:16px 0;">
            <label style="font-size:13px;color:var(--text2)">Qty:</label>
            <input type="number" id="qty" value="1" min="1" max="${p.stock}"
              style="width:60px;padding:8px;border:1.5px solid var(--card-border);border-radius:8px;background:var(--bg);color:var(--text);text-align:center;" />
          </div>
          <div style="display:flex;gap:12px;flex-wrap:wrap;">
            <button class="btn btn-primary" onclick="addToCart(${p.id})">?? Add to Cart</button>
            <button class="btn btn-outline" onclick="buyNow(${p.id})">Buy Now ?</button>
          </div>
        </div>
      `;
    }

    async function addToCart(id) {
      const qty = parseInt(document.getElementById('qty').value) || 1;
      await Cart.add(id, qty);
    }
    async function buyNow(id) {
      const qty = parseInt(document.getElementById('qty').value) || 1;
      await Cart.add(id, qty);
      location.href = '/cart';
    }

    document.addEventListener('DOMContentLoaded', loadProduct);
  </script>
</body>
</html>
