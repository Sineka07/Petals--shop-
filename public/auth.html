<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Petal Shop 🌸</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="particles"></div>
  <div id="toast"></div>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">🌸 Petal Shop</div>
      <div class="tab-switch">
        <button class="active" id="tab-login" onclick="switchTab('login')">Sign In</button>
        <button id="tab-register" onclick="switchTab('register')">Sign Up</button>
      </div>

      <!-- Login -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-input" type="email" id="l-email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-input" type="password" id="l-pass" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Sign In →</button>
        <div class="form-error" id="login-err"></div>
      </form>

      <!-- Register -->
      <form id="register-form" style="display:none" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input class="form-input" type="text" id="r-name" placeholder="Your name" required />
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-input" type="email" id="r-email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-input" type="password" id="r-pass" placeholder="Min 6 characters" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Create Account 🌸</button>
        <div class="form-error" id="reg-err"></div>
      </form>

      <p style="text-align:center;margin-top:16px;font-size:13px;color:var(--text3)">
        <a href="/" style="color:var(--accent)">← Back to Home</a>
      </p>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    // Redirect if already logged in
    if (Auth.isLoggedIn()) location.href = '/';

    function switchTab(tab) {
      document.getElementById('login-form').style.display    = tab === 'login'    ? 'block' : 'none';
      document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
      document.getElementById('tab-login').classList.toggle('active',    tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    }

    async function handleLogin(e) {
      e.preventDefault();
      const err = document.getElementById('login-err');
      err.textContent = '';
      try {
        const res  = await fetch('/api/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('l-email').value, password: document.getElementById('l-pass').value })
        });
        const data = await res.json();
        if (!res.ok) { err.textContent = data.error; return; }
        Auth.setAuth(data.token, data.user);
        location.href = '/';
      } catch { err.textContent = 'Network error'; }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const err = document.getElementById('reg-err');
      err.textContent = '';
      try {
        const res  = await fetch('/api/auth/register', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: document.getElementById('r-name').value, email: document.getElementById('r-email').value, password: document.getElementById('r-pass').value })
        });
        const data = await res.json();
        if (!res.ok) { err.textContent = data.error; return; }
        Auth.setAuth(data.token, data.user);
        location.href = '/';
      } catch { err.textContent = 'Network error'; }
    }
  </script>
</body>
</html>
