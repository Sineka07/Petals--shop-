<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders — Petal Shop 🌸</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="particles"></div>
  <nav class="navbar" id="navbar"></nav>
  <div id="toast"></div>

  <section class="section">
    <h2 class="section-title">My Orders</h2>
    <p class="section-sub">Your order history</p>
    <div id="orders-list">
      <div class="empty-state"><div class="empty-icon">🌸</div><p>Loading...</p></div>
    </div>
  </section>

  <footer><span class="footer-logo">🌸 Petal Shop</span></footer>

  <script src="/js/app.js"></script>
  <script>
    async function loadOrders() {
      if (!Auth.isLoggedIn()) {
        document.getElementById('orders-list').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🔒</div>
            <h3>Please login to view orders</h3>
            <a href="/auth" class="btn btn-primary" style="margin-top:16px">Login</a>
          </div>`;
        return;
      }
      const res    = await fetch('/api/orders/mine', { headers: Auth.headers() });
      const orders = await res.json();
      const el     = document.getElementById('orders-list');
      if (!orders.length) {
        el.innerHTML = `<div class="empty-state">
          <div class="empty-icon">📦</div>
          <h3>No orders yet</h3>
          <p>Start shopping to see your orders here!</p>
          <a href="/shop" class="btn btn-primary" style="margin-top:16px">Shop Now</a>
        </div>`;
        return;
      }
      el.innerHTML = orders.map(o => `
        <div class="order-card">
          <div class="order-header">
            <div>
              <div class="order-id">Order #${o.id}</div>
              <div style="font-size:12px;color:var(--text3);margin-top:4px">${new Date(o.created_at).toLocaleDateString('en-IN', { day:'numeric', month:'long', year:'numeric' })}</div>
            </div>
            <span class="order-status">${o.status === 'confirmed' ? '✅ Confirmed' : o.status}</span>
          </div>
          <div class="order-items-list">
            ${o.items.map(i => `
              <div class="order-item">
                <span>${i.product.image.startsWith('/') 
    ? `<img src="${i.product.image}" alt="${i.product.name}" />` 
    : i.product.image}</span>
                <span>${i.product.image.startsWith('/') 
    ? `<img src="${i.product.image}" alt="${i.product.name}" />` 
    : i.product.image}</span>
                <span style="color:var(--text3)">× ${i.quantity}</span>
                <span style="margin-left:auto">$${(i.price * i.quantity).toFixed(2)}</span>
              </div>
            `).join('')}
          </div>
          <div style="font-size:12px;color:var(--text3);margin-bottom:8px">📍 ${o.address}</div>
          <div class="order-total">Total: $${o.total.toFixed(2)}</div>
        </div>
      `).join('');
    }
    document.addEventListener('DOMContentLoaded', loadOrders);
  </script>
</body>
</html>
